name: ML CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'pipelines/training_pipeline.py'
      - 'config/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Online Endpoint'
        required: true
        type: boolean
        default: true

jobs:
  train-and-deploy:
    name: "Train & Deploy Model"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Azure ML Training & Deployment Pipeline
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          STORAGE_ACCOUNT_DEV: ${{ secrets.STORAGE_ACCOUNT_DEV }}
          STORAGE_ACCOUNT_PROD: ${{ secrets.STORAGE_ACCOUNT_PROD }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.deploy }}" == "false" ]; then
            python pipelines/training_pipeline.py --config config/dev.yml
          else
            python pipelines/training_pipeline.py --config config/dev.yml --deploy
          fi

name: ML Train — Submit Azure ML Job

# Triggered on push to develop (targets dev workspace) or main (targets prod workspace).
# Dataset lives in Azure Blob Storage — no data files are committed to this repo.
# Azure ML fetches the dataset directly from Blob Storage at job runtime.
# To deploy the Online Endpoint after training, set deploy_endpoint input to "true".

on:
  push:
    branches: [develop, main]
    paths:
      - "src/**"
      - "pipelines/**"
      - "config/**"

  workflow_dispatch:
    inputs:
      deploy_endpoint:
        description: "Deploy model to Online Endpoint after training"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      n_estimators:
        description: "XGBoost n_estimators"
        required: false
        default: "200"
      max_depth:
        description: "XGBoost max_depth"
        required: false
        default: "6"
      learning_rate:
        description: "XGBoost learning_rate"
        required: false
        default: "0.1"

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  STORAGE_ACCOUNT_DEV: ${{ secrets.STORAGE_ACCOUNT_DEV }}

jobs:
  train:
    name: Submit Training Job (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          pip install --upgrade pip
          pip install azure-ai-ml>=1.16.0 azure-identity>=1.16.0 pyyaml>=6.0

      - name: Determine environment config
        id: env-config
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "config=config/prod.yml" >> $GITHUB_OUTPUT
            echo "env_label=prod" >> $GITHUB_OUTPUT
          else
            echo "config=config/dev.yml" >> $GITHUB_OUTPUT
            echo "env_label=dev" >> $GITHUB_OUTPUT
          fi

      - name: Submit Azure ML Training Job
        run: |
          DEPLOY_FLAG=""
          if [ "${{ github.event.inputs.deploy_endpoint }}" = "true" ]; then
            DEPLOY_FLAG="--deploy"
          fi

          python pipelines/training_pipeline.py \
            --config ${{ steps.env-config.outputs.config }} \
            --n_estimators ${{ github.event.inputs.n_estimators || '200' }} \
            --max_depth ${{ github.event.inputs.max_depth || '6' }} \
            --learning_rate ${{ github.event.inputs.learning_rate || '0.1' }} \
            $DEPLOY_FLAG

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Training pipeline failed. Check Azure ML Studio for job logs."
          echo "Workspace: ${{ steps.env-config.outputs.env_label }}"

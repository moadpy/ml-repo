# ============================================================
# Development environment — lowest cost configuration
# ============================================================
# Cost drivers for dev:
#   - Compute cluster: 0 min_instances (costs nothing at rest)
#   - 1 max_instance, Standard_DS2_v2 (~$0.13/hr) — scales up only during job
#   - Online Endpoint: 1 replica, same VM size (~$0.13/hr while running)
#   - No VNet / Private Endpoints (fine for dev, handled by IaC in prod)
#   - No zone redundancy
# ============================================================

environment: dev

azure:
  resource_group: dev-env-rg
  location: westeurope

azure_ml:
  workspace_name: aml-rca-dev

  compute:
    name: cpu-cluster-dev
    vm_size: Standard_DS2_v2          # 2 vCPU, 7 GB RAM — enough for 1,500-row XGBoost
    location: westeurope
    min_instances: 0                  # KEY: scale to zero between jobs → no idle cost
    max_instances: 1                  # Single node for dev (no parallelism needed)
    idle_seconds_before_scaledown: 120  # 2 min idle → node released

  training:
    experiment_name: rca-incident-signature-dev
    environment_name: rca-training-env-test
    environment_version: "1"
    python_version: "3.11"
    f1_threshold: 0.72               # Minimum F1-macro across 6 classes to register model

  endpoint:
    name: rca-endpoint-dev
    deployment_name: blue
    instance_type: Standard_D2as_v4
    instance_count: 1                # Single replica for dev

storage:
  container_name: ml-data-dev
  datasets_container: datasets
  # Registered Azure ML datastore name that maps to the 'datasets' blob container.
  # Created by training_pipeline.py if it doesn't already exist.
  # Storage account name is read from STORAGE_ACCOUNT_DEV env variable.
  datastore_name: datasets_datastore
  # Azure ML datastore URI — training jobs fetch directly from the 'datasets' container.
  dataset_blob_uri: "azureml://datastores/datasets_datastore/paths/telemetry_labeled.csv"
  runbooks_prefix: runbooks/
  prompts_prefix: prompts/

# ============================================================
# Development environment — lowest cost configuration
# ============================================================
# Cost drivers for dev:
#   - Compute cluster: 0 min_instances (costs nothing at rest)
#   - 1 max_instance, Standard_DS2_v2 (~$0.13/hr) — scales up only during job
#   - Online Endpoint: 1 replica, same VM size (~$0.13/hr while running)
#   - No VNet / Private Endpoints (no cost, fine for dev)
#   - No zone redundancy
# ============================================================

environment: dev

azure:
  resource_group: rg-mlops-dev
  location: westeurope

azure_ml:
  workspace_name: aml-predictive-maintenance-dev

  compute:
    name: cpu-cluster-dev
    vm_size: Standard_DS2_v2          # 2 vCPU, 7 GB RAM — enough for 10k rows XGBoost
    location: westeurope              # override: create cluster here, not in workspace region (eastus)
    min_instances: 0                  # KEY: scale to zero between jobs → no idle cost
    max_instances: 1                  # Single node for dev (no parallelism needed)
    idle_seconds_before_scaledown: 120  # 2 min idle → node released

  training:
    experiment_name: predictive-maintenance-dev
    environment_name: predictive-maintenance-env
    python_version: "3.11"
    f1_threshold: 0.85               # Minimum F1-macro to register model

  endpoint:
    name: pm-endpoint-dev
    deployment_name: blue
    instance_type: Standard_DS2_v2   # Same VM size (cheapest managed endpoint)
    instance_count: 1                # Single replica for dev

storage:
  container_name: ml-data-dev
  datasets_container: datasets
  # Registered Azure ML datastore name that maps to the 'datasets' blob container.
  # Created at runtime by training_pipeline.py if it doesn't already exist.
  # Storage account name is read from the STORAGE_ACCOUNT_DEV env variable.
  datastore_name: datasets-datastore
  # Azure ML datastore URI — training jobs fetch directly from the 'datasets' container.
  # Format: azureml://datastores/<datastore>/paths/<file>
  dataset_blob_uri: "azureml://datastores/datasets-datastore/paths/predictive_maintenance.csv"
  telemetry_prefix: telemetry/
  procedures_prefix: procedures/
  prompts_prefix: prompts/
